# Inherit eclasses, profiles and licenses from the main ::gentoo tree.
masters = gentoo

# Thin Manifests: only DIST entries for the fetched upstream archives.
# This matches ::gentoo and ::guru.
thin-manifests = true
sign-manifests = false
sign-commits = false

manifest-hashes = BLAKE2B SHA512
manifest-required-hashes = BLAKE2B

cache-formats = md5-dict
update-changelog = false

eapis-banned = 0 1 2 3 4 5 6
