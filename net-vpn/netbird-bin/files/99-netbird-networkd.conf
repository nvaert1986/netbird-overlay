# Created by NetBird to prevent systemd-networkd from removing
# routes and policy rules managed by NetBird.
#
# Upstream writes this file from `netbird service install`, which is not used
# here because the package ships its own unit -- so the package installs it
# instead. Without it, systemd-networkd strips NetBird's routes and policy
# rules and mesh routing breaks.
#
# Shipped under /usr/lib so Portage owns it and removes it on unmerge; a copy
# in /etc/systemd/networkd.conf.d/ still takes precedence over this one.

[Network]
ManageForeignRoutes=no
ManageForeignRoutingPolicyRules=no
